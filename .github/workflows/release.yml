name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # Checkout with the PAT (owned by a user on the rulesets' bypass list)
      # instead of GITHUB_TOKEN: github-actions[bot] cannot be added to a
      # ruleset bypass list, so the tag/release rulesets reject it. The token
      # is persisted as git credentials, so the later `git push` steps use it too.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Get next version
        id: version
        run: |
          VERSION=$(node dist/index.js -b)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "Next version: $VERSION"

      - name: Update package.json version
        run: npm version ${{ steps.version.outputs.version }} --no-git-tag-version

      - name: Commit release version and build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git add -f dist
          git commit -m "chore: release ${{ steps.version.outputs.tag }}"
          git tag ${{ steps.version.outputs.tag }}

      - name: Dogfood - Generate changelog
        run: node dist/index.js -f CHANGELOG.md

      - name: Verify changelog was created
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::Dogfooding failed - changelog was not generated"
            exit 1
          fi
          echo "Changelog generated successfully"

      - name: Add changelog to release commit
        run: |
          git add CHANGELOG.md
          git commit --amend --no-edit
          git tag --force ${{ steps.version.outputs.tag }}

      - name: Push changes and tag
        run: |
          git push origin HEAD:main
          git push origin ${{ steps.version.outputs.tag }}

      - name: Publish to npm
        run: npm publish --provenance

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: CHANGELOG.md
        env:
          # PAT so release creation bypasses the tag/release rulesets
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
